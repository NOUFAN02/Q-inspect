<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Q Inspect — catch malicious QR codes before anyone opens them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#232f4a" stroke-width="1" opacity="0.45"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="340" rx="24"/></clipPath>
    <clipPath id="qrclip"><rect x="186" y="118" width="88" height="88"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <circle cx="230" cy="170" r="190" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="24" fill="none" stroke="#232f4a"/>

  <!-- Emblem: shield with QR code -->
  <path d="M230 62 L316 94 V168 C316 226 279 263 230 284 C181 263 144 226 144 168 V94 Z"
        fill="url(#shield)" stroke="#06b6d4" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#e2f7fb">
    <!-- finder patterns -->
    <rect x="186" y="118" width="24" height="24"/><rect x="190" y="122" width="16" height="16" fill="#151d2e"/><rect x="194" y="126" width="8" height="8"/>
    <rect x="250" y="118" width="24" height="24"/><rect x="254" y="122" width="16" height="16" fill="#151d2e"/><rect x="258" y="126" width="8" height="8"/>
    <rect x="186" y="182" width="24" height="24"/><rect x="190" y="186" width="16" height="16" fill="#141c2c"/><rect x="194" y="190" width="8" height="8"/>
    <!-- data modules (8px grid) -->
    <rect x="218" y="118" width="8" height="8"/><rect x="234" y="118" width="8" height="8"/>
    <rect x="226" y="126" width="8" height="8"/><rect x="218" y="134" width="8" height="8"/><rect x="242" y="134" width="8" height="8"/>
    <rect x="186" y="150" width="8" height="8"/><rect x="202" y="150" width="8" height="8"/><rect x="226" y="150" width="8" height="8"/><rect x="250" y="150" width="8" height="8"/><rect x="266" y="150" width="8" height="8"/>
    <rect x="194" y="158" width="8" height="8"/><rect x="218" y="158" width="8" height="8"/><rect x="242" y="158" width="8" height="8"/>
    <rect x="186" y="166" width="8" height="8"/><rect x="210" y="166" width="8" height="8"/><rect x="234" y="166" width="8" height="8"/><rect x="258" y="166" width="8" height="8"/>
    <rect x="218" y="182" width="8" height="8"/><rect x="242" y="182" width="8" height="8"/><rect x="266" y="182" width="8" height="8"/>
    <rect x="226" y="190" width="8" height="8"/><rect x="250" y="190" width="8" height="8"/>
    <rect x="218" y="198" width="8" height="8"/><rect x="234" y="198" width="8" height="8"/><rect x="258" y="198" width="8" height="8"/>
  </g>
  <!-- scan line -->
  <g>
    <rect x="172" y="160" width="116" height="3" rx="1.5" fill="url(#scan)">
      <animate attributeName="y" values="112;210;112" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Wordmark -->
  <text x="384" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    <tspan fill="#06b6d4">Q</tspan> Inspect
  </text>
  <text x="388" y="214" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">
    Catch malicious QR codes before anyone opens them.
  </text>

  <!-- Verdict pills -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    <rect x="388" y="242" width="92" height="34" rx="17" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="434" y="264" fill="#10b981">SAFE</text>
    <rect x="492" y="242" width="122" height="34" rx="17" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="553" y="264" fill="#f59e0b">CAUTION</text>
    <rect x="626" y="242" width="148" height="34" rx="17" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.5"/>
    <text x="700" y="264" fill="#ef4444">DANGEROUS</text>
  </g>
</svg>
